[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-taxi-demand-prediction"
version = "1.0.0"
description = "Reproducible bike taxi demand analysis and machine learning workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "holidays>=0.42",
  "joblib>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
